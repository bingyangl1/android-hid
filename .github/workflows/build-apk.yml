name: Build & Release APK

on:
  push:
    branches: [main]
    paths: ['android-app/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build release APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$VERSION" = "main" ] && VERSION="latest"
          cp app/build/outputs/apk/debug/app-debug.apk "../bt-hidbridge-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bt-hidbridge
          path: bt-hidbridge-*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk "bt-hidbridge-${GITHUB_REF_NAME}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bt-hidbridge-*.apk
          generate_release_notes: true
